<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted 🎃 Quiz</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <main class="quiz-container">
    <h1>👻 Haunted Quiz</h1>

    <section id="quiz">
      <p id="timer">Time Left: 120s</p>
      <p id="question">Press <strong>Start</strong> to summon your first spooky question...</p>
      <div id="options">
        </div>
    </section>

    <div id="controls">
      <button id="start-btn">Start Quiz</button>
      </div>

    <section id="result" class="hidden"></section>
  </main>

  <script src="/public/script.js"></script>
</body>
</html>
